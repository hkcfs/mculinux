name: Release

# Cut a firmware release from SOURCE, not prebuilts: latest stable kernel +
# busybox are resolved, built, assembled, and QEMU-tested here; the tested
# bytes are what ships. Trigger: push a v* tag, or manual dispatch.
# (python3 for 16MB bootloader patching comes from the builder image.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true

jobs:
  build-all:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[release skip]')
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve latest versions
        id: vers
        run: |
          cd mculinux
          KVER="$(./scripts/latest-stable.sh)"
          BVER="$(./scripts/latest-busybox.sh)"
          [ -n "$KVER" ] || { echo "FAIL: kernel version resolution"; exit 1; }
          [ -n "$BVER" ] || { echo "FAIL: busybox version resolution"; exit 1; }
          echo "Building release from: kernel $KVER, busybox $BVER"
          echo "kver=$KVER" >> $GITHUB_OUTPUT
          echo "bver=$BVER" >> $GITHUB_OUTPUT

      - name: Build kernel (tinyconfig + fragment, strict patches)
        env:
          KERNEL_VERSION: ${{ steps.vers.outputs.kver }}
          XTENSA_CROSS: xtensa-esp32s3-linux-muslfdpic-
        run: |
          cd mculinux
          ./scripts/build-kernel.sh

      - name: Build busybox + rootfs (strict NOMMU patch)
        env:
          BUSYBOX_VERSION: ${{ steps.vers.outputs.bver }}
          XTENSA_CROSS: xtensa-esp32s3-linux-muslfdpic-
        run: |
          cd mculinux
          ./scripts/build-busybox-nommu.sh

      - name: Build etc.jffs2
        run: |
          cd mculinux
          ./scripts/build-etc-jffs2.sh

      - name: Build partition tables
        run: |
          cd mculinux
          ./scripts/build-partition-tables.sh

      - name: Assemble + test all devices
        run: |
          cd mculinux
          for device in r8n8 r8n16 r16n16; do
            ./scripts/build-image.sh "$device"
            ./scripts/test-qemu.sh "$device" 120
          done

      - name: Package (flash images only, no logs)
        run: |
          cd mculinux
          mkdir -p release-staging
          for device in r8n8 r8n16 r16n16; do
            (cd "output/$device" && zip "flash_$device.zip" "flash_$device.bin")
            cp "output/$device/flash_$device.zip" release-staging/
          done
          echo "kernel ${{ steps.vers.outputs.kver }} + busybox ${{ steps.vers.outputs.bver }}" > release-staging/versions.txt
          cat release-staging/versions.txt
          ls -lh release-staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: mculinux/release-staging/
          retention-days: 90

  release:
    needs: build-all
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-images
          path: images

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MCUlinux v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            ## MCUlinux ${{ steps.version.outputs.version }}

            ESP32-S3 Linux, built from source and QEMU boot-tested on all
            devices before release (kernel + busybox versions in versions.txt).

            ### Supported Devices
            - **r8n8**: 8MB PSRAM + 8MB Flash (768KB /data)
            - **r8n16**: 8MB PSRAM + 16MB Flash (8.75MB /data)
            - **r16n16**: 16MB PSRAM + 16MB Flash (8.75MB /data)

            ### Files
            - `flash_r8n8.bin` - Complete 8MB flash image
            - `flash_r8n16.bin` - Complete 16MB flash image
            - `flash_r16n16.bin` - Complete 16MB flash image

            ### Flash
            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 write_flash 0x0 flash_r8n16.bin
            ```
          files: |
            images/flash_r8n8.zip
            images/flash_r8n16.zip
            images/flash_r16n16.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
