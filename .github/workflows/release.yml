name: Release

# Cut a firmware release from SOURCE, not prebuilts: latest stable kernel +
# busybox are resolved, built, assembled, and QEMU-tested here; the tested
# bytes are what ships. Trigger: push a v* tag, or manual dispatch.
# (python3 for 16MB bootloader patching comes from the builder image.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release (for hardware validation builds)'
        required: false
        default: false
        type: boolean

jobs:
  build-all:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[release skip]')
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve latest versions
        id: vers
        run: |
          cd mculinux
          KVER="$(./scripts/latest-stable.sh)"
          BVER="$(./scripts/latest-busybox.sh)"
          [ -n "$KVER" ] || { echo "FAIL: kernel version resolution"; exit 1; }
          [ -n "$BVER" ] || { echo "FAIL: busybox version resolution"; exit 1; }
          echo "Building release from: kernel $KVER, busybox $BVER"
          echo "kver=$KVER" >> $GITHUB_OUTPUT
          echo "bver=$BVER" >> $GITHUB_OUTPUT

      - name: Build kernel (tinyconfig + fragment, strict patches)
        env:
          KERNEL_VERSION: ${{ steps.vers.outputs.kver }}
          XTENSA_CROSS: xtensa-esp32s3-linux-muslfdpic-
        run: |
          cd mculinux
          ./scripts/build-kernel.sh

      - name: Build busybox + rootfs (strict NOMMU patch)
        env:
          BUSYBOX_VERSION: ${{ steps.vers.outputs.bver }}
          XTENSA_CROSS: xtensa-esp32s3-linux-muslfdpic-
        run: |
          cd mculinux
          ./scripts/build-busybox-nommu.sh

      - name: Build etc.jffs2
        run: |
          cd mculinux
          ./scripts/build-etc-jffs2.sh

      - name: Build partition tables
        run: |
          cd mculinux
          ./scripts/build-partition-tables.sh

      - name: Assemble + test all devices
        run: |
          cd mculinux
          for device in r8n8 r8n16 r16n16; do
            ./scripts/build-image.sh "$device"
            ./scripts/test-qemu.sh "$device" 120
          done

      - name: Package (flash images only, no logs)
        run: |
          cd mculinux
          mkdir -p release-staging
          for device in r8n8 r8n16 r16n16; do
            python3 -c 'import sys,zipfile; d=sys.argv[1]; zipfile.ZipFile(f"output/{d}/flash_{d}.zip", "w", zipfile.ZIP_DEFLATED).write(f"output/{d}/flash_{d}.bin", f"flash_{d}.bin")' "$device"
            cp "output/$device/flash_$device.zip" release-staging/
          done
          echo "kernel ${{ steps.vers.outputs.kver }} + busybox ${{ steps.vers.outputs.bver }}" > release-staging/versions.txt
          cat release-staging/versions.txt
          ls -lh release-staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: mculinux/release-staging/
          retention-days: 90

  release:
    needs: build-all
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-images
          path: images

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MCUlinux v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            ## MCUlinux ${{ steps.version.outputs.version }}

            ESP32-S3 Linux, built from source and QEMU boot-tested on all
            devices before release (kernel + busybox versions in versions.txt).

            ### Highlights
            - **WiFi**: lean `eth0` Ethernet over ESP-hosted IPC shmem,
              IPv4 (udhcpc/udhcpc6) + IPv6 (SLAAC, ping6); `wificfg scan`
              lists networks, `wificfg <ssid> [pass]` joins via firmware,
              `wificfg mac` reads the firmware MAC
            - **Buses**: ESP32-S3 GPIO driver (49 pins, chardev) + I2C-GPIO
              (`/dev/i2c-0`)
            - **USB (experimental)**: native Synopsys DWC2 in host mode, with
              HID and mass storage. The driver probes and reaches the
              controller, but **this has never been validated on real
              hardware**, and QEMU does not model the ESP32-S3 USB peripheral
              at all. In QEMU the probe stops at `Bad value for GSNPSID:
              0x00000000`, which is the emulator, not the driver. Expect no
              working USB from this build. Details and the hardware checklist
              are in `docs/USB-WIFI-STATUS.md` on the release branch.

            ### Experimental build
            This is a pre-release for hardware validation. The WiFi path is
            the shipped, working feature. USB is wired and unproven. If you
            are after a known-good WiFi-only build, use the previous
            pre-release instead.

            ### Supported Devices
            - **r8n8**: 8MB PSRAM + 8MB Flash (768KB /data)
            - **r8n16**: 8MB PSRAM + 16MB Flash (8.75MB /data)
            - **r16n16**: 16MB PSRAM + 16MB Flash (8.75MB /data)

            ### Files
            - `flash_r8n8.bin` - Complete 8MB flash image
            - `flash_r8n16.bin` - Complete 16MB flash image
            - `flash_r16n16.bin` - Complete 16MB flash image

            ### Flash
            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 write_flash 0x0 flash_r8n16.bin
            ```
          files: |
            images/flash_r8n8.zip
            images/flash_r8n16.zip
            images/flash_r16n16.zip
          draft: false
          # A dispatch may request a pre-release explicitly; a tag push
          # treats any hyphenated tag as a pre-release by convention (semver
          # pre-release identifiers, e.g. v1.3.0-exp.1). Hyphenated tags were
          # previously published as FINAL by mistake, which is the worst of
          # the three options: an experimental build must never look stable.
          # The event_name guard matters: a dispatch from a branch whose name
          # contains a hyphen (exp-wifi-usb-support) must still honour the
          # explicit input rather than being forced to a pre-release.
          prerelease: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease
            || (github.event_name == 'push' && contains(github.ref_name, '-')) }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
