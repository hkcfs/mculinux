name: Build Docker Images

# Pre-baked builder + tester images live on GHCR so CI jobs never
# download or compile the toolchain/sources/QEMU twice.
# The toolchain base image (ghcr.io/.../toolchain) is EXCLUDED here:
# CI checkouts lack the toolchain, so it is built + pushed manually
# (see mculinux/docker/Dockerfile.toolchain) on toolchain updates only.
# NOTE: after the first push, set packages to Public
# (ghcr.io > package settings) or same-repo pulls need extra auth.

on:
  push:
    branches: [main]
    paths:
      - 'mculinux/docker/**'
  pull_request:
    branches: [main]
    paths:
      - 'mculinux/docker/**'
  schedule:
    - cron: '0 3 * * 0'  # Weekly base refresh, Sundays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: builder
            dockerfile: mculinux/docker/Dockerfile.builder
          - name: tester
            dockerfile: mculinux/docker/Dockerfile.tester

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
