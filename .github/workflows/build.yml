name: Build & Test

# Fast path (push/PR): assemble flash from committed prebuilts + QEMU
# boot-test, all devices in parallel inside the slim tester image (~minutes).
# Full path (monthly cron / dispatch): build the kernel from source inside
# the fat builder image, then assemble + test all devices.
# Images: ghcr.io/<repo>/builder and .../tester (see docker.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'  # Monthly full build, 1st of month 02:00 UTC

concurrency:
  # Per-event groups: a manual/nightly full run must not cancel an in-flight
  # push run (or vice versa); same-event reruns still cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TESTER_IMAGE: ghcr.io/${{ github.repository }}/tester:latest
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/builder:latest

jobs:
  fast:
    name: fast (${{ matrix.device }})
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    strategy:
      fail-fast: false
      matrix:
        device: [r8n8, r8n16, r16n16]
    container:
      image: ghcr.io/${{ github.repository }}/tester:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Assemble flash image from prebuilts
        run: |
          cd mculinux
          ./scripts/build-image.sh ${{ matrix.device }}

      - name: Boot test in QEMU
        run: |
          cd mculinux
          ./scripts/test-qemu.sh ${{ matrix.device }} 90

      - name: Upload flash image
        uses: actions/upload-artifact@v4
        with:
          name: flash-${{ matrix.device }}
          path: mculinux/output/${{ matrix.device }}/flash_${{ matrix.device }}.bin
          retention-days: 30

  full:
    # Automation policy: ALWAYS build the latest stable kernel AND latest
    # stable busybox, apply our patches, rebuild everything. Applies cleanly
    # -> green. Fails -> loud red error, we make new patches. Never pin a
    # "known good" version to avoid testing the new one. Green builds commit
    # the fresh binaries back, so the fast path always tests current bits.
    name: full (latest stable kernel + busybox, rebuild all)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Builder image defaults to non-root; CI needs root to write
      # GITHUB_OUTPUT/GITHUB_ENV via the runner's mounted _temp dir.
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve latest versions
        id: vers
        run: |
          cd mculinux
          KVER="$(./scripts/latest-stable.sh)"
          BVER="$(./scripts/latest-busybox.sh)"
          [ -n "$KVER" ] || { echo "FAIL: kernel version resolution"; exit 1; }
          [ -n "$BVER" ] || { echo "FAIL: busybox version resolution"; exit 1; }
          echo "Latest stable: kernel $KVER, busybox $BVER"
          echo "kver=$KVER" >> $GITHUB_OUTPUT
          echo "bver=$BVER" >> $GITHUB_OUTPUT

      - name: Compute build fingerprint
        id: fp
        run: |
          cd mculinux
          # Fingerprint over every input that shapes the committed binaries:
          # versions + patches + build scripts + rootfs sources. If it matches
          # the committed fingerprint, a rebuild would only re-embed fresh
          # timestamps, so skip instead of committing daily churn.
          FP_NEW=$( {
            cat patches/linux-esp32/*.patch patches/linux-esp32/fragment.config
            cat patches/busybox-nommu/*
            cat scripts/build-kernel.sh scripts/build-busybox-nommu.sh \
                scripts/build-rootfs.sh scripts/build-etc-jffs2.sh
            find rootfs -type f -exec sha256sum {} + | sort -k2
            echo "kver=${{ steps.vers.outputs.kver }}"
            echo "bver=${{ steps.vers.outputs.bver }}"
          } | sha256sum | cut -d' ' -f1 )
          echo "fp_new=$FP_NEW" >> $GITHUB_OUTPUT
          FP_OLD="$(cat tools/prebuilt/binaries/.fingerprint 2>/dev/null || echo none)"
          if [ "$FP_NEW" = "$FP_OLD" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Fingerprint unchanged ($FP_NEW), skipping rebuild"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Fingerprint changed (old=$FP_OLD new=$FP_NEW), rebuilding"
          fi

      - name: Build kernel (tinyconfig + fragment, strict patches)
        if: ${{ steps.fp.outputs.skip != 'true' }}
        env:
          KERNEL_VERSION: ${{ steps.vers.outputs.kver }}
          XTENSA_CROSS: xtensa-esp32s3-linux-muslfdpic-
        run: |
          cd mculinux
          ./scripts/build-kernel.sh

      - name: Build busybox + rootfs (strict NOMMU patch)
        if: ${{ steps.fp.outputs.skip != 'true' }}
        env:
          BUSYBOX_VERSION: ${{ steps.vers.outputs.bver }}
          XTENSA_CROSS: xtensa-esp32s3-linux-muslfdpic-
        run: |
          cd mculinux
          ./scripts/build-busybox-nommu.sh

      - name: Build etc.jffs2
        if: ${{ steps.fp.outputs.skip != 'true' }}
        run: |
          cd mculinux
          ./scripts/build-etc-jffs2.sh

      - name: Assemble + test all devices
        if: ${{ steps.fp.outputs.skip != 'true' }}
        run: |
          cd mculinux
          for device in r8n8 r8n16 r16n16; do
            ./scripts/build-image.sh "$device"
            ./scripts/test-qemu.sh "$device" 90
          done

      - name: Upload kernel + rootfs + flashes
        if: ${{ steps.fp.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ steps.vers.outputs.kver }}-bb${{ steps.vers.outputs.bver }}
          path: |
            mculinux/tools/prebuilt/binaries/xipImage-*
            mculinux/tools/prebuilt/binaries/rootfs.erofs
            mculinux/tools/prebuilt/binaries/etc.jffs2
            mculinux/output/*/flash_*.bin
          retention-days: 30

      - name: Commit fresh binaries back to main
        if: ${{ steps.fp.outputs.skip != 'true' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mculinux-ci"
          git config user.email "mculinux-ci@users.noreply.github.com"
          echo "${{ steps.fp.outputs.fp_new }}" > mculinux/tools/prebuilt/binaries/.fingerprint
          git add mculinux/tools/prebuilt/binaries/xipImage-* \
                  mculinux/tools/prebuilt/binaries/rootfs.erofs \
                  mculinux/tools/prebuilt/binaries/etc.jffs2 \
                  mculinux/tools/prebuilt/binaries/.fingerprint
          git diff --cached --quiet && echo "Nothing changed, skipping commit" && exit 0
          git commit -m "full: kernel ${{ steps.vers.outputs.kver }} + busybox ${{ steps.vers.outputs.bver }} (automated)"
          git push origin HEAD:main
