name: Build & Test

# Fast path (push/PR): assemble flash from committed prebuilts + QEMU
# boot-test, all devices in parallel inside the slim tester image (~minutes).
# Full path (nightly cron / dispatch): build the kernel from source inside
# the fat builder image, then assemble + test all devices.
# Images: ghcr.io/<repo>/builder and .../tester (see docker.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly full build, 02:00 UTC

concurrency:
  # Per-event groups: a manual/nightly full run must not cancel an in-flight
  # push run (or vice versa); same-event reruns still cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TESTER_IMAGE: ghcr.io/${{ github.repository }}/tester:latest
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/builder:latest

jobs:
  fast:
    name: fast (${{ matrix.device }})
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    strategy:
      fail-fast: false
      matrix:
        device: [r8n8, r8n16, r16n16]
    container:
      image: ghcr.io/${{ github.repository }}/tester:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Assemble flash image from prebuilts
        run: |
          cd mculinux
          ./scripts/build-image.sh ${{ matrix.device }}

      - name: Boot test in QEMU
        run: |
          cd mculinux
          ./scripts/test-qemu.sh ${{ matrix.device }} 90

      - name: Upload flash image
        uses: actions/upload-artifact@v4
        with:
          name: flash-${{ matrix.device }}
          path: mculinux/output/${{ matrix.device }}/flash_${{ matrix.device }}.bin
          retention-days: 30

  full:
    # Automation policy: ALWAYS build the latest stable kernel and apply our
    # patches. Applies cleanly -> green. Fails -> loud red error, we make new
    # patches. Never pin a "known good" version to avoid testing the new one.
    name: full (latest stable + ESP32 patches)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Builder image defaults to non-root; CI needs root to write
      # GITHUB_OUTPUT/GITHUB_ENV via the runner's mounted _temp dir.
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve latest stable kernel
        id: kver
        run: |
          # Owner's snippet, verbatim. Same logic as scripts/latest-stable.sh.
          KVER="$(curl -s --max-time 30 https://kernel.org \
            | grep -A 1 'stable:' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$KVER" ]; then echo "FAIL: could not resolve latest stable from kernel.org"; exit 1; fi
          echo "Latest stable: $KVER"
          echo "version=$KVER" >> $GITHUB_OUTPUT

      - name: Extract kernel source (pre-fetched in image, else download)
        run: |
          KVER='${{ steps.kver.outputs.version }}'
          if [ -f "/opt/src/linux-$KVER.tar.xz" ]; then
            tar -xf "/opt/src/linux-$KVER.tar.xz" -C /tmp
          else
            echo "Not pre-fetched, downloading linux-$KVER..."
            curl -sL --retry 3 "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$KVER.tar.xz" \
              -o "/tmp/linux-$KVER.tar.xz" || \
            curl -sL --retry 5 "https://mirrors.edge.kernel.org/pub/linux/kernel/v7.x/linux-$KVER.tar.xz" \
              -o "/tmp/linux-$KVER.tar.xz"
            tar -xf "/tmp/linux-$KVER.tar.xz" -C /tmp
          fi
          echo "KSRC=/tmp/linux-$KVER" >> $GITHUB_ENV

      - name: Apply ESP32 patches (STRICT — any failure is a red build)
        working-directory: ${{ env.KSRC }}
        run: |
          KPATCH="$GITHUB_WORKSPACE/mculinux/patches/linux-esp32"
          test -d "$KPATCH" || { echo "FAIL: $KPATCH missing"; exit 1; }
          for patch in "$KPATCH"/0*.patch; do
            echo "Applying $(basename "$patch")..."
            patch -p1 --batch --forward < "$patch" || exit 1
          done
          cp "$KPATCH/defconfig" .config
          echo "All ESP32 patches applied cleanly"

      - name: Build xipImage
        working-directory: ${{ env.KSRC }}
        run: |
          # CROSS_COMPILE must be explicit: the port defconfig carries a stale
          # 'xtensa_esp32s3-' prefix that does not match our toolchain.
          export ARCH=xtensa
          export CROSS_COMPILE=xtensa-esp32s3-linux-muslfdpic-
          make olddefconfig
          make -j"$(nproc)" KCFLAGS="-Oz -fmerge-all-constants" xipImage
          ls -lh arch/xtensa/boot/xipImage

      - name: Assemble + test all devices
        run: |
          cd mculinux
          KV="$(echo '${{ steps.kver.outputs.version }}' | cut -d. -f1,2)"
          cp "$KSRC/arch/xtensa/boot/xipImage" "tools/prebuilt/binaries/xipImage-$KV"
          for device in r8n8 r8n16 r16n16; do
            ./scripts/build-image.sh "$device" --kernel "$KV"
            ./scripts/test-qemu.sh "$device" 90
          done

      - name: Upload kernel + flashes
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ steps.kver.outputs.version }}
          path: |
            mculinux/tools/prebuilt/binaries/xipImage-*
            mculinux/output/*/flash_*.bin
          retention-days: 30
