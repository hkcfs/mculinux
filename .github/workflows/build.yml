name: Build & Test

# Fast path (push/PR): assemble flash from committed prebuilts + QEMU
# boot-test, all devices in parallel inside the slim tester image (~minutes).
# Full path (nightly cron / dispatch): build the kernel from source inside
# the fat builder image, then assemble + test all devices.
# Images: ghcr.io/<repo>/builder and .../tester (see docker.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly full build, 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TESTER_IMAGE: ghcr.io/${{ github.repository }}/tester:latest
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/builder:latest

jobs:
  fast:
    name: fast (${{ matrix.device }})
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    strategy:
      fail-fast: false
      matrix:
        device: [r8n8, r8n16, r16n16]
    container:
      image: ghcr.io/${{ github.repository }}/tester:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Assemble flash image from prebuilts
        run: |
          cd mculinux
          ./scripts/build-image.sh ${{ matrix.device }}

      - name: Boot test in QEMU
        run: |
          cd mculinux
          ./scripts/test-qemu.sh ${{ matrix.device }} 90

      - name: Upload flash image
        uses: actions/upload-artifact@v4
        with:
          name: flash-${{ matrix.device }}
          path: mculinux/output/${{ matrix.device }}/flash_${{ matrix.device }}.bin
          retention-days: 30

  full:
    name: full (kernel ${{ matrix.kernel }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Add '7.2.3' once patches/linux-7.2.3/ is captured (see BRINGUP-7.2.3.md §6).
        kernel: ['7.1.3']
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract kernel source (pre-fetched in image)
        run: |
          tar -xf /opt/src/linux-${{ matrix.kernel }}.tar.xz -C /tmp
          echo "KSRC=/tmp/linux-${{ matrix.kernel }}" >> $GITHUB_ENV

      - name: Apply ESP32-S3 patches
        working-directory: ${{ env.KSRC }}
        run: |
          KPATCH="$GITHUB_WORKSPACE/mculinux/patches/linux-$(echo '${{ matrix.kernel }}' | cut -d. -f1,2)"
          for patch in "$KPATCH"/0*.patch; do
            echo "Applying $(basename "$patch")..."
            git apply --check "$patch" 2>/dev/null && git apply "$patch" || \
              patch -p1 < "$patch" || echo "WARN: patch may already be applied"
          done
          [ -x "$KPATCH/apply.sh" ] && bash "$KPATCH/apply.sh" || true
          cp "$KPATCH/defconfig" .config

      - name: Build xipImage
        working-directory: ${{ env.KSRC }}
        run: |
          export ARCH=xtensa
          make olddefconfig
          make -j"$(nproc)" KCFLAGS="-Oz -fmerge-all-constants" xipImage
          ls -lh arch/xtensa/boot/xipImage

      - name: Assemble + test all devices
        run: |
          cd mculinux
          KV="$(echo '${{ matrix.kernel }}' | cut -d. -f1,2)"
          cp "$KSRC/arch/xtensa/boot/xipImage" "tools/prebuilt/binaries/xipImage-$KV"
          for device in r8n8 r8n16 r16n16; do
            ./scripts/build-image.sh "$device" --kernel "$KV"
            ./scripts/test-qemu.sh "$device" 90
          done

      - name: Upload kernel + flashes
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.kernel }}
          path: |
            mculinux/tools/prebuilt/binaries/xipImage-*
            mculinux/output/*/flash_*.bin
          retention-days: 30
