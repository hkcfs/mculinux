name: Build & Test

# Fast path (push/PR): assemble flash from committed prebuilts + QEMU
# boot-test, all devices in parallel inside the slim tester image (~minutes).
# Full path (nightly cron / dispatch): build the kernel from source inside
# the fat builder image, then assemble + test all devices.
# Images: ghcr.io/<repo>/builder and .../tester (see docker.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly full build, 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TESTER_IMAGE: ghcr.io/${{ github.repository }}/tester:latest
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/builder:latest

jobs:
  fast:
    name: fast (${{ matrix.device }})
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    strategy:
      fail-fast: false
      matrix:
        device: [r8n8, r8n16, r16n16]
    container:
      image: ghcr.io/${{ github.repository }}/tester:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Assemble flash image from prebuilts
        run: |
          cd mculinux
          ./scripts/build-image.sh ${{ matrix.device }}

      - name: Boot test in QEMU
        run: |
          cd mculinux
          ./scripts/test-qemu.sh ${{ matrix.device }} 90

      - name: Upload flash image
        uses: actions/upload-artifact@v4
        with:
          name: flash-${{ matrix.device }}
          path: mculinux/output/${{ matrix.device }}/flash_${{ matrix.device }}.bin
          retention-days: 30

  full:
    name: full (branch ${{ matrix.branch }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Kernel branches; latest patch per branch auto-resolved above.
        # '7.2' activates itself once patches/linux-7.2*/ is captured
        # (see BRINGUP-7.2.3.md §6) — until then the job skips loudly.
        # Patch dirs are globbed (linux-7.1*/ matches linux-7.1.3/).
        branch: ['7.1', '7.2']
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Builder image defaults to non-root; CI needs root to write
      # GITHUB_OUTPUT/GITHUB_ENV via the runner's mounted _temp dir.
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve latest stable patch for branch
        id: kver
        run: |
          BRANCH='${{ matrix.branch }}'
          KVER="$(curl -sL --max-time 30 https://www.kernel.org/releases.json \
            | grep -o "\"version\": \"$BRANCH\.[0-9]*\"" | grep -oE '[0-9.]+' \
            | sort -V | tail -1)"
          if [ -z "$KVER" ]; then echo "FAIL: could not resolve latest $BRANCH from kernel.org"; exit 1; fi
          echo "Latest $BRANCH stable: $KVER"
          echo "version=$KVER" >> $GITHUB_OUTPUT

      - name: Extract kernel source (pre-fetched in image, else download)
        run: |
          KVER='${{ steps.kver.outputs.version }}'
          if [ -f "/opt/src/linux-$KVER.tar.xz" ]; then
            tar -xf "/opt/src/linux-$KVER.tar.xz" -C /tmp
          else
            echo "Not pre-fetched, downloading linux-$KVER..."
            curl -sL --retry 3 "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$KVER.tar.xz" \
              -o "/tmp/linux-$KVER.tar.xz" || \
            curl -sL --retry 5 "https://mirrors.edge.kernel.org/pub/linux/kernel/v7.x/linux-$KVER.tar.xz" \
              -o "/tmp/linux-$KVER.tar.xz"
            tar -xf "/tmp/linux-$KVER.tar.xz" -C /tmp
          fi
          echo "KSRC=/tmp/linux-$KVER" >> $GITHUB_ENV

      - name: Check ESP32-S3 patches exist for branch
        id: patchcheck
        shell: bash
        run: |
          shopt -s nullglob
          DIRS=("$GITHUB_WORKSPACE"/mculinux/patches/linux-${{ matrix.branch }}*/)
          if [ "${#DIRS[@]}" -gt 0 ]; then
            echo "Using patches: ${DIRS[0]}"
            echo "present=true" >> $GITHUB_OUTPUT
            echo "patchdir=${DIRS[0]}" >> $GITHUB_OUTPUT
          else
            echo "SKIP: no patches/linux-${{ matrix.branch }}*/ yet — branch activates on capture"
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply ESP32-S3 patches
        if: steps.patchcheck.outputs.present == 'true'
        working-directory: ${{ env.KSRC }}
        run: |
          KPATCH='${{ steps.patchcheck.outputs.patchdir }}'
          for patch in "$KPATCH"/0*.patch; do
            echo "Applying $(basename "$patch")..."
            git apply --check "$patch" 2>/dev/null && git apply "$patch" || \
              patch -p1 < "$patch" || echo "WARN: patch may already be applied"
          done
          [ -x "$KPATCH/apply.sh" ] && bash "$KPATCH/apply.sh" || true
          cp "$KPATCH/defconfig" .config

      - name: Build xipImage
        if: steps.patchcheck.outputs.present == 'true'
        working-directory: ${{ env.KSRC }}
        run: |
          export ARCH=xtensa
          make olddefconfig
          make -j"$(nproc)" KCFLAGS="-Oz -fmerge-all-constants" xipImage
          ls -lh arch/xtensa/boot/xipImage

      - name: Assemble + test all devices
        if: steps.patchcheck.outputs.present == 'true'
        run: |
          cd mculinux
          KV='${{ matrix.branch }}'
          cp "$KSRC/arch/xtensa/boot/xipImage" "tools/prebuilt/binaries/xipImage-$KV"
          for device in r8n8 r8n16 r16n16; do
            ./scripts/build-image.sh "$device" --kernel "$KV"
            ./scripts/test-qemu.sh "$device" 90
          done

      - name: Upload kernel + flashes
        if: steps.patchcheck.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.branch }}-${{ steps.kver.outputs.version }}
          path: |
            mculinux/tools/prebuilt/binaries/xipImage-*
            mculinux/output/*/flash_*.bin
          retention-days: 30
